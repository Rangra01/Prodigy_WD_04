<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Real-Time Chat</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <header class="auth-head">
      <span class="brand-mark">RC</span>
      <h1>Welcome back</h1>
      <p>Log in to continue to your chats.</p>
    </header>

    <div id="infoBanner" class="banner banner-success" role="status" hidden></div>
    <div id="formError" class="banner banner-error" role="alert" hidden></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required />
          <button type="button" class="toggle-pass" data-target="password">Show</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-alt">No account yet? <a href="/register.html">Create one</a></p>
    <p class="auth-alt muted"><a href="/">&larr; Back to home</a></p>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
