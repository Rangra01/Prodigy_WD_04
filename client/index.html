<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
  <main class="landing">
    <span class="brand-mark">RC</span>
    <h1>Real-Time Chat</h1>
    <p class="landing-sub">Group rooms and private messages, delivered instantly. No refresh, no clutter.</p>
    <div class="landing-actions">
      <a class="btn btn-primary" href="/login.html">Log in</a>
      <a class="btn btn-secondary" href="/register.html">Create account</a>
    </div>
  </main>
  <script>
    // If a session token already exists, go straight to the dashboard.
    try {
      if (localStorage.getItem('chat_token')) window.location.replace('/chat.html');
    } catch (err) {
      /* localStorage unavailable — stay on the landing page. */
    }
  </script>
</body>
</html>
